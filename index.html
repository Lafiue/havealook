<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--  -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> special </title>
    <style>
        /* */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /*  */
        body {
            /*  */
            background: linear-gradient(135deg, #f8e9f0 0%, #e0f0f9 100%);
            min-height: 100vh;
            /*  */
            display: flex;
            justify-content: center;
            align-items: center;
            /*  */
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            padding: 20px;
        }

        /*  */
        .text-box {
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 40px 30px;
            /*  */
            box-shadow: 0 8px 30px rgba(180, 160, 200, 0.1);
            /*  */
            animation: fadeIn 1.2s ease-in-out;
        }

        /*  */
        .soft-text {
            font-size: clamp(1.2rem, 3vw, 2rem); /*  */
            color: #5a5466; /*  */
            line-height: 1.8; /*  */
            text-align: center;
            letter-spacing: 0.5px; /*  */
        }

        /*  */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="text-box">
        <!--  -->
        <p class="soft-text">奇奇怪怪的链接你都点
            注意安全咯</p>
    </div>
</body>
</html>
